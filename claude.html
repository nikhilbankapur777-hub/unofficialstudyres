<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting…</title>

  <!-- Instant redirect (works even if JS is slow to load) -->
  <meta http-equiv="refresh" content="0; url=https://claude.ai/artifact/XSEY6iQd3heZAqcov28mQ5#slide-3dd33bdac6c2">

  <!-- Canonical / SEO hint -->
  <link rel="canonical" href="https://claude.ai/artifact/XSEY6iQd3heZAqcov28mQ5#slide-3dd33bdac6c2">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f7f7f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #333;
    }
    .wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      padding: 32px 40px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 420px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 12px;
    }
    p {
      margin: 0 0 16px;
      color: #666;
      font-size: 0.95rem;
    }
    a {
      color: #c96442;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #e5e5e5;
      border-top-color: #c96442;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Redirecting…</h1>
      <p>You're being sent to the Claude artifact.</p>
      <p>
        Not redirected?
        <a href="https://claude.ai/artifact/XSEY6iQd3heZAqcov28mQ5#slide-3dd33bdac6c2">
          Click here to continue →
        </a>
      </p>
    </div>
  </div>

  <script>
    (function () {
      var TARGET_URL = "https://claude.ai/artifact/XSEY6iQd3heZAqcov28mQ5#slide-3dd33bdac6c2";

      // Only redirect in a real browser context
      if (typeof window === "undefined" || typeof window.location === "undefined") {
        return;
      }

      // Avoid redirect loops if we're already on claude.ai
      if (window.location.hostname === "claude.ai") {
        return;
      }

      // Use replace() so the redirecting page isn't kept in history
      try {
        window.location.replace(TARGET_URL);
      } catch (e) {
        // Fallback
        window.location.href = TARGET_URL;
      }
    })();
  </script>
</body>
</html>
