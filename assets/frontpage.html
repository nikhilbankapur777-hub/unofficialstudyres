<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment Front Page Generator</title>
<style>
:root{--navy:#262a78;--ink:#1b1d29;--muted:#667;--line:#d9dbe6;--bg:#f3f4f9;--card:#fff;--err:#c62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:28px 16px 8px;max-width:1100px;margin:0 auto}
h1{margin:0;font-size:22px;color:var(--navy)}
header p{margin:4px 0 0;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
form,.preview{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.fixed{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.fixed b{color:var(--ink)}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}
label small,.hint{font-weight:400;color:var(--muted)}
.hint{font-size:12px;margin-top:4px}
input,select{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--navy);outline-offset:0;border-color:transparent}
input:user-invalid,select:user-invalid{border-color:var(--err)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{margin-top:22px;width:100%;padding:12px;font:inherit;font-weight:700;color:#fff;background:var(--navy);border:0;border-radius:10px;cursor:pointer}
button:hover{filter:brightness(1.15)}
.msg{margin-top:10px;font-size:13px;color:var(--err);min-height:1.2em}
.preview h2{margin:0 0 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.preview h2:not(:first-child){margin-top:22px}
.pg{position:relative;width:100%;aspect-ratio:210/297;background:#fff;box-shadow:0 2px 14px rgba(20,20,60,.18);container-type:inline-size;overflow:hidden}
.pg>*{position:absolute}
.pg .t{white-space:nowrap;line-height:1;font-family:Helvetica,Arial,sans-serif;font-weight:700}
.pg .t.serif{font-family:"Liberation Serif","Times New Roman",Times,serif}
.pg .t.serif.n{font-weight:400}
.pg .empty{position:static;display:grid;place-items:center;height:100%;color:var(--muted);font-size:14px;text-align:center;padding:24px}
</style>
</head>
<body>
<header>
  <h1>Assignment Front Page &amp; Questions</h1>
  <p>Fill in your details, pick your group, then download one PDF with the front page and your assignment page.</p>
</header>
<main>
  <form id="f" autocomplete="off">
    <div class="fixed"><b>Course:</b> Problem Solving using Python &middot; <b>Code:</b> 25CSE144</div>

    <label for="roll">Roll No.</label>
    <input id="roll" required placeholder="1NH25CS567 (C-52)" maxlength="30">
    <div class="hint">Write it like this: 1NH25CS567 (C-52)</div>

    <label for="name">Name of the student</label>
    <input id="name" required placeholder="Full name" maxlength="40">

    <div class="row">
      <div>
        <label for="sem">Semester</label>
        <select id="sem">
          <option>I</option><option>II</option><option>III</option><option>IV</option>
          <option>V</option><option>VI</option><option>VII</option><option>VIII</option>
        </select>
      </div>
      <div>
        <label for="sec">Section</label>
        <input id="sec" required value="C" maxlength="3">
      </div>
    </div>

    <label for="grp">Group</label>
    <select id="grp" required>
      <option value="" selected disabled>Select your group</option>
      <option value="1">Group 1 &ndash; roll no. ends in 0, 3, 5, 7</option>
      <option value="2">Group 2 &ndash; roll no. ends in 1, 6, 8</option>
      <option value="3">Group 3 &ndash; roll no. ends in 2, 4, 9</option>
    </select>

    <label for="date">Date of submission <small>(optional)</small></label>
    <input id="date" type="date">

    <label for="fac">Name of the faculty</label>
    <input id="fac" required value="Ms. Chitra C" maxlength="40">

    <button type="submit">Download PDF</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>

  <section class="preview">
    <h2>Page 1 &ndash; Front page</h2>
    <div class="pg" id="p1"></div>
    <h2>Page 2 &ndash; Assignment</h2>
    <div class="pg" id="p2"></div>
  </section>
</main>

// parse "plain **bold** text" into words made of runs {s, bold, font}
function parseWords(p){
  const words = []; let cur = [], bold = false;
  const push = () => { if (cur.length){ words.push(cur); cur = []; } };
  for (let i = 0; i < p.length; i++){
    if (p.startsWith("**", i)){ bold = !bold; i++; continue; }
    const ch = p[i];
    if (ch === " "){ push(); continue; }
    const font = ch === "₹" ? "dj" : "serif", last = cur[cur.length-1];
    if (last && last.bold === bold && last.font === font) last.s += ch; else cur.push({s:ch, bold, font});
  }
  push(); return words;
}
const runW = (r, size) => W(r.s, size, r.font, r.bold);
const wordW = (w, size) => w.reduce((a, r) => a + runW(r, size), 0);
function wrap(p, size, maxW){
  const sp = W(" ", size, "serif", false), lines = []; let line = [], lw = 0;
  for (const w of parseWords(p)){
    const ww = wordW(w, size);
    if (line.length && lw + sp + ww > maxW){ lines.push(line); line = []; lw = 0; }
    lw += (line.length ? sp : 0) + ww; line.push(w);
  }
  if (line.length) lines.push(line);
  return {lines, sp};
}
function emitLine(ops, line, sp, x, y, size){
  line.forEach((w, wi) => {
    if (wi) x += sp;
    for (const r of w){ ops.push({k:"text", s:r.s, x, y, size, a:"left", font:r.font, bold:r.bold}); x += runW(r, size); }
  });
}

  };
  center("DEPARTMENT OF COMPUTER SCIENCE & ENGINEERING", 60, 12);
  center("Assignment – 1", 66.5, 12, true);
  center(`GROUP ${gk} - (Roll Number ends in ${g.ends})`, 72.5, 12, true);
  const L = 26, R = 130, left = (s, y, x = L) => ops.push({k:"text", s, x, y, size:12, a:"left", font:"serif", bold:true});
  left("COURSE:  Problem solving using Python", 83);   left("COURSE CODE: 25CSE144", 83, R);
  left("DATE OF PUBLISHING: 08/10/2026", 89.5);        left("SEM/SEC: I/C", 89.5, R);
  left("MAX. MARKS: 5M", 96);
  left("LAST DATE OF SUBMISSION: 13/10/2026", 102.5);

  const X = 26, cols = [14, 93, 21, 30], TW = cols.reduce((a, b) => a + b), PAD = 2, SZ = 11, LH = 5.2, GAP = 3.2;
  const cx = [X, X+cols[0], X+cols[0]+cols[1], X+cols[0]+cols[1]+cols[2]];
  let y = 109;
  const cell = (i, y, h) => ops.push({k:"rect", x:cx[i], y, w:cols[i], h, lw:.3});
  // header row
  const HH = 12.5;
  [0,1,2,3].forEach(i => cell(i, y, HH));
  const hc = (s, i, yy) => { const w = W(s, 12, "serif", true); ops.push({k:"text", s, x:cx[i]+(cols[i]-w)/2, y:yy, size:12, a:"left", font:"serif", bold:true}); };
  hc("Q #", 0, y+7.6); hc("Question", 1, y+7.6); hc("Page No.", 2, y+7.6);
  hc("Teacher’s", 3, y+5.6); hc("Remark", 3, y+10.6);
  y += HH;
  g.qs.forEach((paras, qi) => {
    const blocks = paras.map(p => wrap(p, SZ, cols[1] - 2*PAD));
    const n = blocks.reduce((a, b) => a + b.lines.length, 0);
    const content = n * LH + (blocks.length - 1) * GAP;
    const h = Math.max(18, content + 6);
    [0,1,2,3].forEach(i => cell(i, y, h));
    let ty = y + (h - content) / 2 + LH * .75;
    blocks.forEach((b, bi) => {
      if (bi) ty += GAP;
      b.lines.forEach(line => { emitLine(ops, line, b.sp, cx[1]+PAD, ty, SZ); ty += LH; });
    });
    const num = `${qi+1}.`, nw = W(num, SZ, "serif", false);
    ops.push({k:"text", s:num, x:cx[0]+(cols[0]-nw)/2, y:y+h/2+1.4, size:SZ, a:"left", font:"serif", bold:false});
    y += h;
  });
  return ops;
}

/* ---------- renderers ---------- */
const pc = n => (n / PW * 100) + "%", pcy = n => (n / PH * 100) + "%";
function drawDom(el, ops){
  el.innerHTML = "";
  for (const o of ops){
    let e;
    if (o.k === "rect"){
      e = document.createElement("div");
      Object.assign(e.style, {left:pc(o.x), top:pcy(o.y), width:pc(o.w), height:pcy(o.h), border:`${Math.max(o.lw/PW*100,.15)}cqw solid #000`, boxSizing:"border-box"});
    } else if (o.k === "line"){
      e = document.createElement("div");
      Object.assign(e.style, {left:pc(o.x1), top:pcy(o.y1), width:pc(o.x2-o.x1), height:Math.max(o.lw/PW*100,.15)+"cqw", background:"#000"});
    } else if (o.k === "img"){
      e = document.createElement("img"); e.src = o.src; e.alt = "";
      Object.assign(e.style, {left:pc(o.x), top:pcy(o.y), width:pc(o.w), height:pcy(o.h)});
    } else {
      e = document.createElement("div"); e.className = "t" + (o.font ? " serif" : "") + (o.font && !o.bold ? " n" : "");
      e.textContent = o.s;
      const tr = o.a === "center" ? "translate(-50%,-80%)" : o.a === "right" ? "translate(-100%,-80%)" : "translate(0,-80%)";
      Object.assign(e.style, {left:pc(o.x), top:pcy(o.y), transform:tr, fontSize:(o.size*PT/PW*100)+"cqw"});
      if (o.font === "dj") e.style.fontFamily = '"DejaVu Serif",serif';
    }
    el.appendChild(e);
  }
}
function drawPdfPage(doc, ops){
  for (const o of ops){
    if (o.k === "rect"){ doc.setLineWidth(o.lw); doc.rect(o.x, o.y, o.w, o.h); }
    else if (o.k === "line"){ doc.setLineWidth(o.lw); doc.line(o.x1, o.y1, o.x2, o.y2); }
    else if (o.k === "img"){ doc.addImage(o.src, "JPEG", o.x, o.y, o.w, o.h); }
    else { setF(doc, o); doc.text(o.s, o.x, o.y, {align:o.a}); }
  }
}

/* ---------- form ---------- */
function values(){
  const up = id => $(id).value.trim().replace(/\s+/g, " ").toUpperCase();
  const g = $("grp").value;
  return {
    roll: up("roll"), name: up("name"),
    semsec: $("sem").value + " SEMESTER / " + up("sec") + " SECTION",
    date: fmtDate($("date").value), fac: up("fac"),
    grp: g ? `1 (GROUP ${g})` : "", g,
  };
}
function refresh(){
  const v = values();
  drawDom($("p1"), layout1(v));
  if (v.g) drawDom($("p2"), layout2(v.g));
  else $("p2").innerHTML = '<div class="empty">Select your group to see your assignment page.</div>';
}
const safe = s => s.replace(/[^A-Za-z0-9-]+/g, "_").replace(/^_+|_+$/g, "");
$("f").addEventListener("input", refresh);
$("f").addEventListener("submit", e => {
  e.preventDefault();
  const v = values();
  if (!v.roll || !v.name || !v.g || !v.fac || !$("sec").value.trim()){ $("msg").textContent = "Please fill in all the required fields."; return; }
  $("msg").textContent = "";
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  registerFonts(doc);
  drawPdfPage(doc, layout1(v));
  doc.addPage();
  drawPdfPage(doc, layout2(v.g));
  doc.save(`Assignment_1_Group${v.g}_${safe(v.roll)}.pdf`);
});
refresh();
</script>
