<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Study Resources — Nikhil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --bg:#000;
    --card:#0a0a0a;
    --border:#1a1a1a;
    --accent:#007aff;
    --muted:#666;
    --text:#f2f2f2;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:"Space Grotesk", sans-serif;
    min-height:100vh;
  }
  a{ color:inherit; text-decoration:none; }
  :focus{ outline:none; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* === icon-btn — same as profile.html, icon shrunk to 14px === */
  .icon-btn{
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    cursor:pointer;
    -webkit-user-select:none; user-select:none;
    overflow:hidden;
  }
  .icon-btn:active{ background:rgba(0,0,0,.55); }
  .icon-btn img{ width:14px; height:14px; pointer-events:none; }

  /* === topbar — same as profile.html === */
  .topbar{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 16px;
    z-index:5;
  }
  .topbar-right{ display:flex; align-items:center; gap:10px; position:relative; }

  /* === wallpaper — same as profile.html (230px) === */
  .wallpaper-wrap{
    position:relative;
    height:230px;
    width:100%;
    overflow:hidden;
    background:#111;
  }
  .wallpaper-wrap img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .wallpaper-fade{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 55%, var(--bg) 100%);
  }

  .dropdown{
    position:absolute;
    top:46px; right:0;
    background:rgba(20,20,20,.55);
    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:6px;
    min-width:160px;
    z-index:20;
    opacity:0;
    transform:translateY(-6px) scale(.97);
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .dropdown.open{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .dropdown-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 12px; border-radius:10px;
    font-size:.86rem; color:#eee; cursor:pointer;
  }
  .dropdown-item:active{ background:rgba(255,255,255,.08); }
  .dropdown-item i{ width:16px; text-align:center; color:#9aa0a6; font-size:.9rem; }

  /* ---------- page body ---------- */
  .page-body{ padding:22px 20px 60px; max-width:640px; margin:0 auto; }
  .tagline{
    font-size:1.05rem;
    font-weight:600;
    color:#fff;
    margin-bottom:4px;
  }
  .tagline-sub{
    font-size:.82rem;
    color:var(--muted);
    margin-bottom:22px;
  }

  .subject-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .subject-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .subject-card:active{ transform:scale(.98); }
  .subject-card:hover{ border-color:#2a2a2a; }
  .subject-icon{
    width:36px; height:36px;
    margin-bottom:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .subject-icon img{ width:28px; height:28px; }
  .subject-name{ font-size:.98rem; font-weight:600; color:#fff; margin-bottom:4px; }
  .subject-desc{ font-size:.78rem; color:var(--muted); line-height:1.4; }

  .subject-card.disabled{
    opacity:.4;
    cursor:not-allowed;
    position:relative;
  }
  .subject-card.disabled:active{ transform:none; }
  .coming-soon-tag{
    position:absolute;
    top:14px; right:14px;
    font-size:.62rem;
    font-weight:600;
    letter-spacing:.04em;
    color:var(--muted);
    background:rgba(255,255,255,.06);
    padding:3px 8px;
    border-radius:20px;
  }

  .toast{
    position:fixed; bottom:34px; left:50%;
    transform:translateX(-50%);
    background:rgba(24,24,24,.9);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    padding:10px 18px; border-radius:30px;
    font-size:.82rem; color:#fff;
    z-index:300;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .toast.show{ opacity:1; }

  /* ---------- share overlay ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.92);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .overlay-topbar{ position:absolute; top:0; left:0; right:0; padding:18px 16px; z-index:2; }
  .share-card{
    width:min(88vw,360px);
    max-height:82vh;
    overflow-y:auto;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .share-title{ font-weight:600; font-size:1rem; color:#fff; }
  .share-link-row{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--border);
    border-radius:14px;
    padding:9px 9px 9px 14px;
  }
  .share-link-row span{
    flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:.76rem; color:#9aa0a6; font-family:"Space Mono", monospace;
  }
  .copy-btn{
    background:var(--accent); color:#fff; border:none;
    padding:8px 13px; border-radius:10px;
    font-size:.76rem; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .share-apps{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .share-app{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    font-size:.7rem; color:#9aa0a6; cursor:pointer; background:none; border:none;
  }
  .share-app .circle{
    width:50px; height:50px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1.25rem; color:#fff;
  }
  .share-qr{ display:flex; flex-direction:column; align-items:center; gap:8px; padding-top:4px; }
  .share-qr img{ width:150px; height:150px; border-radius:14px; background:#fff; padding:8px; }
  .share-qr span{ font-size:.74rem; color:var(--muted); }
</style>
</head>
<body>

<div class="wallpaper-wrap">
  <img src="assets/college.png" alt="">
  <div class="wallpaper-fade"></div>
  <div class="topbar">
    <div></div>
    <div class="topbar-right">
      <div class="icon-btn" id="aiBtn" onclick="onAiClick()"><img src="assets/ai.svg" alt="ai"></div>
      <div class="icon-btn" id="moreBtn" onclick="toggleMenu(event)"><img src="assets/threedot.svg" alt="more"></div>
      <div class="dropdown" id="dropdown">
        <div class="dropdown-item" onclick="onShareClick()"><i class="fa-solid fa-share-nodes"></i>Share</div>
        <div class="dropdown-item" onclick="onDeveloperClick()"><i class="fa-solid fa-code"></i>Developer</div>
      </div>
    </div>
  </div>
</div>

<div class="page-body">
  <div class="tagline">Unofficial study resources by Nikhil</div>
  <div class="tagline-sub">Notes, PDFs, and videos — pick a subject</div>
  <div class="subject-grid" id="subjectGrid"></div>
</div>

<div class="overlay" id="shareOverlay">
  <div class="overlay-topbar"><div class="icon-btn" onclick="closeOverlay()"><img src="assets/back.svg" alt="back"></div></div>
  <div class="share-card">
    <div class="share-title">Share this page</div>
    <div class="share-link-row"><span id="shareUrlText"></span><button class="copy-btn" onclick="copyShareLink()">Copy</button></div>
    <div class="share-apps">
      <button class="share-app" onclick="shareVia('whatsapp')"><span class="circle" style="background:#25D366"><i class="fa-brands fa-whatsapp"></i></span>WhatsApp</button>
      <button class="share-app" onclick="shareVia('telegram')"><span class="circle" style="background:#229ED9"><i class="fa-brands fa-telegram"></i></span>Telegram</button>
      <button class="share-app" onclick="shareVia('x')"><span class="circle" style="background:#000;border:1px solid #333"><i class="fa-brands fa-x-twitter"></i></span>X</button>
    </div>
    <div class="share-qr"><img id="shareQrImg" src="" alt="QR code"><span>Scan to open</span></div>
  </div>
</div>

<div class="toast" id="toast">Community AI — coming soon</div>

<script>
  var openOverlayName = null;
  var shareState = { url: window.location.href, message: 'Unofficial study resources by Nikhil' };
  var SUBJECT_ORDER = ['physics', 'electronics', 'maths', 'programming', 'special'];

  function escapeHtml(str){
    var d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function fetchJson(paths){
    var path = paths[0];
    return fetch(path).then(function(res){
      if(!res.ok) throw new Error('not ok');
      return res.json();
    }).catch(function(err){
      if(paths.length > 1) return fetchJson(paths.slice(1));
      throw err;
    });
  }

  function renderSubjects(subjects){
    var grid = document.getElementById('subjectGrid');
    grid.innerHTML = SUBJECT_ORDER.map(function(key){
      var s = subjects[key];
      if(!s) return '';
      var enabled = s.enabled !== false;
      var classes = 'subject-card' + (enabled ? '' : ' disabled');
      var onclick = enabled ? ' onclick="goToSubject(\'' + key + '\')"' : '';
      var tag = enabled ? '' : '<div class="coming-soon-tag">Coming soon</div>';
      return (
        '<div class="' + classes + '"' + onclick + '>' +
          tag +
          '<div class="subject-icon"><img src="' + s.icon + '" alt=""></div>' +
          '<div class="subject-name">' + escapeHtml(s.name || key) + '</div>' +
          '<div class="subject-desc">' + escapeHtml(s.description || '') + '</div>' +
        '</div>'
      );
    }).join('');
  }

  function goToSubject(key){
    window.location.href = 'subject.html?subject=' + encodeURIComponent(key);
  }

  function onAiClick(){
    var t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  function toggleMenu(e){
    if(e) e.stopPropagation();
    document.getElementById('dropdown').classList.toggle('open');
  }
  document.addEventListener('click', function(e){
    var dd = document.getElementById('dropdown');
    var moreBtn = document.getElementById('moreBtn');
    if(dd && dd.classList.contains('open') && !dd.contains(e.target) && e.target !== moreBtn && !moreBtn.contains(e.target)){
      dd.classList.remove('open');
    }
  });

  function onDeveloperClick(){
    document.getElementById('dropdown').classList.remove('open');
    window.location.href = 'https://nikhilbankapur777-hub.github.io/communityx/profile.html?id=nikhil@commx';
  }

  function openOverlayEl(name){
    document.getElementById('dropdown').classList.remove('open');
    openOverlayName = name;
    document.getElementById(name).classList.add('open');
    history.pushState({ overlay:name }, '', window.location.href);
  }
  function closeOverlay(){
    history.back();
  }
  window.addEventListener('popstate', function(){
    if(openOverlayName){
      var el = document.getElementById(openOverlayName);
      if(el) el.classList.remove('open');
      openOverlayName = null;
    }
  });

  function onShareClick(){
    document.getElementById('dropdown').classList.remove('open');
    var url = window.location.href;
    shareState = { url:url, message:'Unofficial study resources by Nikhil' };
    document.getElementById('shareUrlText').textContent = url;
    document.getElementById('shareQrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(url);
    openOverlayEl('shareOverlay');
  }

  function shareVia(app){
    var url = shareState.url;
    var text = shareState.message;
    var target = '';
    if(app === 'whatsapp'){
      target = 'https://wa.me/?text=' + encodeURIComponent(text + ' ' + url);
    } else if(app === 'telegram'){
      target = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
    } else if(app === 'x'){
      target = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
    }
    if(target) window.open(target, '_blank', 'noopener');
  }

  function copyShareLink(){
    var url = shareState.url;
    function showToast(){
      var t = document.getElementById('toast');
      t.textContent = 'Link copied';
      t.classList.add('show');
      setTimeout(function(){
        t.classList.remove('show');
        setTimeout(function(){ t.textContent = 'Community AI — coming soon'; }, 200);
      }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(showToast).catch(showToast);
    } else {
      var ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      showToast();
    }
  }

  fetchJson(['assets/subjects.json', 'subjects.json']).then(function(data){
    renderSubjects(data);
  }).catch(function(){
    document.getElementById('subjectGrid').innerHTML =
      '<div style="grid-column:1/-1;color:var(--muted);text-align:center;padding:40px 0;">Could not load subjects.json.</div>';
  });
</script>
</body>
</html>
