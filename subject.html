<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7e6">
<title>Subject — Study Resources</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&display=swap" rel="stylesheet">

<script>
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("js-anim");
</script>

<style>
/* Stitched pop-paper — same language as index.html */
:root {
  --cream: #fff7e6; --ink: #1a1650; --ink-soft: rgba(26, 22, 80, .72);
  --peri: #6b8ce8; --peri-soft: #c4d3fa; --butter: #fff3a8; --rose: #f4a6b8; --sage: #a9c5a0; --mustard: #efc050; --claude: #d97757;
  --display: "Fraunces", Georgia, serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pad-x: clamp(16px, 4vw, 32px);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --outline: 3px solid var(--ink);
  --pop: 5px 5px 0 var(--ink);
  --blob: 38% 62% 55% 45% / 50% 40% 60% 50%;
  --flower: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='white'><circle cx='50' cy='50' r='30'/><circle cx='50' cy='20' r='17'/><circle cx='71.2' cy='28.8' r='17'/><circle cx='80' cy='50' r='17'/><circle cx='71.2' cy='71.2' r='17'/><circle cx='50' cy='80' r='17'/><circle cx='28.8' cy='71.2' r='17'/><circle cx='20' cy='50' r='17'/><circle cx='28.8' cy='28.8' r='17'/></g></svg>");
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; background: var(--cream); }
body {
  margin: 0; min-width: 320px; min-height: 100vh; color: var(--ink); font-family: var(--body); font-size: 1.05rem; line-height: 1.6;
  background-color: var(--cream); background-image: radial-gradient(rgba(26, 22, 80, .1) 1.6px, transparent 1.6px); background-size: 24px 24px;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
img, svg { display: block; max-width: 100%; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-decoration: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--claude); outline-offset: 3px; }
h1, h2, h3, .display { font-family: var(--display); font-weight: 900; font-variation-settings: "SOFT" 100, "WONK" 1; line-height: .95; letter-spacing: -.015em; }
.kicker { font-family: var(--display); font-weight: 400; font-variation-settings: "SOFT" 100, "WONK" 0; font-size: clamp(1.15rem, 2.2vw, 1.5rem); }

.shell { width: min(1000px, 100%); margin: auto; padding: 0 var(--pad-x) 80px; }

/* top bar */
.topbar {
  position: sticky; top: 12px; z-index: 40; margin-top: 12px; height: 64px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 10px 0 10px; background: #fff; border: var(--outline); border-radius: 999px; box-shadow: var(--pop);
}
.topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--ink); color: var(--cream); transition: transform .2s var(--ease), background .2s; }
.icon-btn:hover { transform: rotate(-10deg) scale(1.08); background: var(--claude); }
.icon-btn svg { width: 20px; height: 20px; }
.topbar-title { font-family: var(--display); font-weight: 900; font-variation-settings: "SOFT" 100, "WONK" 1; font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dev-btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px 0 14px; background: var(--butter); border: var(--outline); border-radius: 999px; font-weight: 700; font-size: .92rem; transition: transform .15s var(--ease), box-shadow .15s var(--ease); box-shadow: 3px 3px 0 var(--ink); }
.dev-btn:hover { transform: translate(1px, 1px) rotate(-1.5deg); box-shadow: 1px 1px 0 var(--ink); }
.dev-btn svg { width: 18px; height: 18px; }
.yt-btn { color: #ff3b30; }
.yt-btn:hover { background: var(--ink); color: #ff3b30; }

/* subject header */
.subject-hero {
  --c: var(--butter);
  position: relative; isolation: isolate; overflow: hidden; margin-top: 22px;
  display: flex; align-items: center; gap: clamp(16px, 3vw, 32px);
  padding: clamp(24px, 4.5vw, 48px); background: var(--c); border: var(--outline); border-radius: 36px; box-shadow: 8px 8px 0 var(--ink);
}
.subject-hero::before { content: ""; position: absolute; z-index: -1; right: -6%; top: -30%; width: clamp(160px, 28vw, 300px); aspect-ratio: 1; background: rgba(255, 255, 255, .6); -webkit-mask: var(--flower) center / 100% 100% no-repeat; mask: var(--flower) center / 100% 100% no-repeat; animation: spin 50s linear infinite; }
.subject-hero::after { content: ""; position: absolute; inset: 10px; border: 2px dashed rgba(26, 22, 80, .3); border-radius: 27px; pointer-events: none; }
.subject-header-icon { position: relative; z-index: 1; display: grid; place-items: center; flex: none; width: clamp(64px, 11vw, 92px); height: clamp(64px, 11vw, 92px); background: var(--ink); border-radius: var(--blob); }
.subject-header-icon img { width: 46%; height: 46%; object-fit: contain; }
.subject-header-text { position: relative; z-index: 1; min-width: 0; }
.subject-header-name { font-size: clamp(2.2rem, 7vw, 4.4rem); line-height: .92; }
.subject-header-desc { margin-top: 10px; max-width: 46ch; font-weight: 500; color: var(--ink-soft); line-height: 1.45; }
.count { display: inline-block; margin-top: 16px; padding: 5px 16px; background: #fff; border: var(--outline); border-radius: 999px; font-size: .82rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }

/* resources */
.list-head { margin: clamp(36px, 6vw, 56px) 0 18px; }
.list-head h2 { font-size: clamp(2rem, 5vw, 3.2rem); }
.resource-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 18px; counter-reset: r; }
.resource-btn {
  position: relative; display: flex; align-items: center; gap: 16px; padding: 20px 20px 20px 18px;
  background: #fff; border: var(--outline); border-radius: 24px; box-shadow: var(--pop);
  transition: transform .3s var(--ease), box-shadow .3s var(--ease);
}
.resource-btn::after { content: ""; position: absolute; inset: 7px; border: 2px dashed rgba(26, 22, 80, .22); border-radius: 17px; pointer-events: none; }
.resource-btn:hover { transform: translateY(-5px) rotate(-1deg); box-shadow: 8px 10px 0 var(--ink); }
.resource-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.num { position: relative; z-index: 1; display: grid; place-items: center; flex: none; width: 50px; height: 50px; border: var(--outline); border-radius: var(--blob); background: var(--rose); font-family: var(--display); font-weight: 900; font-size: 1.1rem; }
.num::before { counter-increment: r; content: counter(r, decimal-leading-zero); }
.resource-btn:nth-child(5n+2) .num { background: var(--butter); }
.resource-btn:nth-child(5n+3) .num { background: var(--sage); }
.resource-btn:nth-child(5n+4) .num { background: var(--peri-soft); }
.resource-btn:nth-child(5n+5) .num { background: var(--mustard); }
.resource-text { position: relative; z-index: 1; flex: 1; min-width: 0; }
.resource-heading { display: block; font-family: var(--display); font-weight: 900; font-variation-settings: "SOFT" 100, "WONK" 1; font-size: 1.3rem; line-height: 1.05; margin-bottom: 4px; }
.resource-desc { display: block; color: var(--ink-soft); font-size: .95rem; line-height: 1.4; }
.go { position: relative; z-index: 1; display: grid; place-items: center; flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: var(--cream); transition: transform .2s var(--ease); }
.go svg { width: 16px; height: 16px; }
.resource-btn:hover .go { transform: translateX(4px); }

.empty-state { grid-column: 1 / -1; max-width: 520px; margin: clamp(40px, 8vw, 80px) auto; padding: 32px 28px; text-align: center; background: #fff; border: 3px dashed var(--ink); border-radius: 28px; font-weight: 700; font-size: 1.05rem; }
.empty-state.solo { margin-top: 28px; }

/* motion */
.js-anim [data-enter] { opacity: 0; }
.is-ready [data-enter] { animation: enterUp .9s var(--ease) both; animation-delay: calc(var(--d, 0) * 1ms); }
.js-anim .reveal { opacity: 0; translate: 0 44px; rotate: calc(var(--dir, 1) * 2.5deg); scale: .96; transition: opacity .7s ease calc(var(--i, 0) * 70ms), translate .9s var(--ease) calc(var(--i, 0) * 70ms), rotate .9s var(--ease) calc(var(--i, 0) * 70ms), scale .9s var(--ease) calc(var(--i, 0) * 70ms), transform .3s var(--ease), box-shadow .3s var(--ease); }
.js-anim .reveal.in { opacity: 1; translate: 0 0; rotate: 0deg; scale: 1; }
@keyframes spin { to { rotate: 360deg; } }
@keyframes enterUp { from { opacity: 0; translate: 0 28px; } to { opacity: 1; translate: 0 0; } }

@media (max-width: 640px) {
  .topbar { height: 58px; }
  .dev-btn { padding: 0; width: 44px; justify-content: center; }
  .dev-btn span { display: none; }
  .subject-hero { flex-direction: column; align-items: flex-start; border-radius: 28px; box-shadow: 5px 5px 0 var(--ink); }
  .subject-hero::after { border-radius: 19px; }
  .resource-btn { box-shadow: 4px 4px 0 var(--ink); padding: 16px 14px 16px 14px; gap: 12px; }
  .num { width: 44px; height: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" type="button" aria-label="Back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="topbar-title" id="topbarTitle">Subject</span>
    </div>
    <div class="topbar-right">
      <a class="dev-btn" id="devBtn" href="https://nikhilbankapur777-hub.github.io/communityx/profile.html?id=nikhil@commx" aria-label="Developer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg><span>Developer</span>
      </a>
      <button class="icon-btn yt-btn" id="ytBtn" type="button" aria-label="YouTube videos">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.51 3.55 12 3.55 12 3.55s-7.51 0-9.38.5A3.02 3.02 0 0 0 .5 6.19 31.6 31.6 0 0 0 0 12a31.6 31.6 0 0 0 .5 5.81 3.02 3.02 0 0 0 2.12 2.14c1.87.5 9.38.5 9.38.5s7.51 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14A31.6 31.6 0 0 0 24 12a31.6 31.6 0 0 0-.5-5.81zM9.55 15.57V8.43L15.82 12z"/></svg>
      </button>
    </div>
  </header>

  <main id="pageBody">
    <div class="empty-state solo">Loading…</div>
  </main>
</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var subjectKey = params.get('subject');
  var root = document.documentElement;
  var SUBJECT_COLORS = { physics: 'var(--butter)', electronics: 'var(--rose)', maths: 'var(--sage)', programming: 'var(--peri-soft)', special: 'var(--mustard)', AI: '#fff' };

  function escapeHtml(str){ var d = document.createElement('div'); d.innerText = str; return d.innerHTML; }
  function escapeAttr(str){ return escapeHtml(String(str)).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function safeUrl(u){ u = String(u || '#').trim(); return /^(javascript|data|vbscript):/i.test(u) ? '#' : u; }
  function goBack(){ if(history.length > 1) history.back(); else window.location.href = 'index.html'; }

  function fetchJson(paths){
    var path = paths[0];
    return fetch(path).then(function(res){ if(!res.ok) throw new Error('not ok'); return res.json(); })
      .catch(function(err){ if(paths.length > 1) return fetchJson(paths.slice(1)); throw err; });
  }

  /* reveal on scroll */
  var io = null;
  if (root.classList.contains('js-anim')) {
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.1, rootMargin: '0px 0px -5% 0px' });
  }
  function prepReveal(scope){
    if(!io) return;
    (scope || document).querySelectorAll('.reveal').forEach(function(el){
      if(el.dataset.watched) return;
      el.dataset.watched = '1';
      var i = Array.prototype.indexOf.call(el.parentElement.children, el);
      el.style.setProperty('--i', i % 6);
      el.style.setProperty('--dir', i % 2 ? -1 : 1);
      io.observe(el);
    });
  }

  function renderNotFound(msg){
    document.getElementById('pageBody').innerHTML = '<div class="empty-state solo">' + msg + '</div>';
  }

  function render(subject){
    var name = subject.name || subjectKey;
    document.title = name + ' — Study Resources';
    document.getElementById('topbarTitle').textContent = name;
    document.getElementById('ytBtn').onclick = function(){
      window.location.href = 'yt.html?subject=' + encodeURIComponent(subjectKey);
    };

    var resources = subject.resources || [];
    var resourcesHtml = resources.length
      ? resources.map(function(r){
          return '<a class="resource-btn reveal" href="' + escapeAttr(safeUrl(r.link)) + '" target="_blank" rel="noopener">' +
            '<span class="num" aria-hidden="true"></span>' +
            '<span class="resource-text">' +
              '<span class="resource-heading">' + escapeHtml(r.heading || '') + '</span>' +
              '<span class="resource-desc">' + escapeHtml(r.description || '') + '</span>' +
            '</span>' +
            '<span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>' +
          '</a>';
        }).join('')
      : '<div class="empty-state">No resources yet</div>';

    var color = SUBJECT_COLORS[subjectKey] || 'var(--butter)';
    var countText = resources.length + (resources.length === 1 ? ' resource' : ' resources');

    document.getElementById('pageBody').innerHTML =
      '<section class="subject-hero" data-enter style="--c:' + color + ';--d:100">' +
        '<div class="subject-header-icon"><img src="' + escapeAttr(subject.icon || '') + '" alt=""></div>' +
        '<div class="subject-header-text">' +
          '<h1 class="subject-header-name">' + escapeHtml(name) + '</h1>' +
          (subject.description ? '<p class="subject-header-desc">' + escapeHtml(subject.description) + '</p>' : '') +
          '<span class="count">' + countText + '</span>' +
        '</div>' +
      '</section>' +
      '<div class="list-head reveal"><p class="kicker">Notes, PDFs &amp; videos</p><h2>Pick one.</h2></div>' +
      '<div class="resource-list">' + resourcesHtml + '</div>';

    prepReveal(document.getElementById('pageBody'));
  }

  if(!subjectKey){
    renderNotFound('No subject was given in the link.');
  } else {
    fetchJson(['assets/subjects.json', 'subjects.json']).then(function(data){
      var subject = data[subjectKey];
      if(!subject){ renderNotFound('No subject found for "' + escapeHtml(subjectKey) + '".'); return; }
      if(subject.enabled === false){
        document.getElementById('topbarTitle').textContent = subject.name || subjectKey;
        renderNotFound('Coming soon.');
        return;
      }
      render(subject);
    }).catch(function(){ renderNotFound('Could not load subjects.json.'); });
  }

  requestAnimationFrame(function(){ root.classList.add('is-ready'); });
</script>
</body>
</html>
